spring.application.name=fleetops

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/fleetops}
spring.datasource.username=${DB_USERNAME:fleetops}
spring.datasource.password=${DB_PASSWORD:fleetops}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

server.port=${SERVER_PORT:18081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.aitovavi.fleetops=INFO
