spring.application.name=fleetops

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/fleetops}
spring.datasource.username=${DB_USERNAME:fleetops}
spring.datasource.password=${DB_PASSWORD:fleetops}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

server.port=${SERVER_PORT:18081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.aitovavi.fleetops=INFO
security.jwt.secret=${JWT_SECRET:fleetops-local-development-secret-key-change-me-2026}
security.jwt.issuer=${JWT_ISSUER:fleetops}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}

security.auth.admin.username=${ADMIN_USERNAME:admin}
security.auth.admin.password=${ADMIN_PASSWORD:admin-change-me}

security.auth.user.username=${USER_USERNAME:user}
security.auth.user.password=${USER_PASSWORD:user-change-me}